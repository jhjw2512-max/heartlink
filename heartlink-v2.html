<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하트링크 | HeartLink</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#342735;background:#fff6f9}*{box-sizing:border-box}body{margin:0}header{padding:22px 20px;background:linear-gradient(135deg,#ff5b98,#fa7f9d);color:white}header h1{margin:0;font-size:27px}header p{margin:5px 0 0;font-size:13px}main{max-width:520px;margin:auto;padding:20px 16px 105px}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 9px 28px #e69cb42b;margin-bottom:16px}.avatar{height:220px;border-radius:18px;background:linear-gradient(135deg,#ffe3ee,#e4d9ff);display:grid;place-items:center;font-size:82px}.name{font-size:23px;font-weight:750;margin:18px 0 7px}.muted{color:#7c7080;font-size:14px;line-height:1.6}.buttons{display:flex;gap:12px;margin-top:18px}button{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#f94d89;color:white;flex:1}.secondary{background:#fff0f5;color:#e33c79;flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 4px 22px;border-top:1px solid #f2dce5}nav button{background:transparent;color:#806e78;padding:7px;font-size:13px}nav button.active{color:#ed3679}section{display:none}section.active{display:block}.message{padding:15px;background:#fff2f7;border-radius:15px;margin-top:12px}.pill{display:inline-block;padding:7px 12px;border-radius:20px;background:#ffe2ee;color:#d52e71;font-size:12px}input,textarea{width:100%;padding:12px;border:1px solid #ecd9e2;border-radius:12px;font:inherit;margin:8px 0}textarea{min-height:95px;resize:vertical}.notice{font-size:12px;color:#847583;text-align:center;margin-top:18px}#status{font-size:13px;margin-top:12px;white-space:pre-wrap}button:disabled{opacity:.5}
</style></head><body>
<header><h1>♥ HeartLink</h1><p>설레는 인연이 시작되는 곳</p></header><main>
<section id="discover" class="active"><div class="card"><span class="pill">오늘의 추천 인연</span><div class="avatar" id="avatar" style="margin-top:15px">🌷</div><div class="name" id="person">하린, 27</div><div class="muted" id="intro">커피와 산책을 좋아해요. 편하게 이야기 나눠요 ☕</div><div class="buttons"><button class="secondary" onclick="nextPerson()">다음 보기 ↻</button><button class="primary" onclick="likePerson()">♥ 좋아요</button></div></div><p class="notice">현재 프로필은 예시입니다. 실제 사용자가 아닙니다.</p></section>
<section id="matches"><div class="card"><h2>💕 나의 좋아요</h2><p class="muted">시제품에서 누른 좋아요가 여기에 표시됩니다.</p><div id="liked">아직 좋아요가 없어요.</div></div></section>
<section id="chat"><div class="card"><h2>💬 채팅</h2><p class="muted">실제 채팅은 추후 안전한 매칭 및 접근권한 설정 후 제공됩니다.</p><div class="message">👋 하트링크에 오신 것을 환영합니다!</div></div></section>
<section id="profile"><div class="card"><h2>🔐 회원가입 · 로그인</h2><p id="sessionLabel" class="muted">로그인하지 않았습니다.</p><div id="authForm"><label>이메일<input id="email" type="email" autocomplete="email" placeholder="이메일"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="8자 이상"></label><div class="buttons"><button class="primary" onclick="signUp()">회원가입</button><button class="secondary" onclick="signIn()">로그인</button></div></div><button id="logout" class="secondary" style="display:none" onclick="signOut()">로그아웃</button><p id="status" role="status"></p></div><div class="card" id="profileEditor" style="display:none"><h2>👤 내 프로필</h2><label>닉네임<input id="nickname" maxlength="40" placeholder="닉네임 입력"></label><label>자기소개<textarea id="bio" maxlength="500" placeholder="나를 소개해 주세요"></textarea></label><button class="primary" style="width:100%" onclick="saveProfile()">프로필 저장</button><p class="muted">로그인한 계정의 프로필로 저장됩니다.</p></div></section>
</main><nav><button class="active" onclick="show('discover',this)">🏠<br>발견</button><button onclick="show('matches',this)">💕<br>좋아요</button><button onclick="show('chat',this)">💬<br>채팅</button><button onclick="show('profile',this)">👤<br>프로필</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// Supabase 대시보드의 Project URL 및 Publishable key를 아래에 입력하세요.
// Secret key, service_role 키, 데이터베이스 비밀번호는 절대 넣지 마세요.
const SUPABASE_URL='https://ogpajxeeleffnoqnbryc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_eCrhkDtIZM5TfggaFCmO1g_q3qSDGwk';
const configured=SUPABASE_URL.startsWith('https://')&&SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_');
const db=configured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const people=[['🌷','하린, 27','커피와 산책을 좋아해요. 편하게 이야기 나눠요 ☕'],['🎨','지우, 29','전시회와 음악을 좋아해요 🎵'],['🌻','서윤, 26','맛집 탐방과 여행을 좋아합니다 ✈️']];let current=0;let likes=[];let user=null;
const el=id=>document.getElementById(id);const msg=s=>el('status').textContent=s;
function render(){el('avatar').textContent=people[current][0];el('person').textContent=people[current][1];el('intro').textContent=people[current][2]}
function nextPerson(){current=(current+1)%people.length;render()}
function likePerson(){const name=people[current][1];if(!likes.includes(name))likes.push(name);el('liked').textContent=likes.join(' ♥ ');alert(name+'님에게 좋아요를 눌렀어요! (시연용)');nextPerson()}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.remove('active'));el(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function credentials(){const email=el('email').value.trim(),password=el('password').value;if(!email||password.length<8)throw Error('이메일과 8자 이상의 비밀번호를 입력하세요.');return {email,password}}
async function signUp(){if(!db)return msg('Supabase 연결 정보를 먼저 입력하세요.');try{const {email,password}=credentials();const {data,error}=await db.auth.signUp({email,password});if(error)throw error;msg(data.session?'회원가입 및 로그인 성공!':'회원가입 요청 완료. 이메일 인증이 활성화되어 있다면 메일함에서 인증 링크를 눌러주세요.')}catch(e){msg('회원가입 오류: '+e.message)}}
async function signIn(){if(!db)return msg('Supabase 연결 정보를 먼저 입력하세요.');try{const {email,password}=credentials();const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;msg('로그인 성공!')}catch(e){msg('로그인 오류: '+e.message)}}
async function signOut(){if(!db)return;const {error}=await db.auth.signOut();msg(error?'로그아웃 오류: '+error.message:'로그아웃했습니다.')}
async function updateSession(){if(!db)return msg('Supabase 연결 정보를 설정하면 회원가입을 사용할 수 있습니다.');const {data:{user:u},error}=await db.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')msg(error.message);user=u;el('sessionLabel').textContent=u?'로그인: '+u.email:'로그인하지 않았습니다.';el('authForm').style.display=u?'none':'block';el('logout').style.display=u?'block':'none';el('profileEditor').style.display=u?'block':'none';if(u){const {data,error:e}=await db.from('profiles').select('nickname,bio').eq('id',u.id).maybeSingle();if(e)msg('프로필 조회 오류: '+e.message);el('nickname').value=data?.nickname||'';el('bio').value=data?.bio||''}}
async function saveProfile(){if(!db||!user)return msg('먼저 로그인하세요.');const nickname=el('nickname').value.trim(),bio=el('bio').value.trim();if(!nickname)return msg('닉네임을 입력하세요.');const {error}=await db.from('profiles').upsert({id:user.id,nickname,bio},{onConflict:'id'});msg(error?'저장 오류: '+error.message:'프로필이 저장됐습니다!')}
if(db){db.auth.onAuthStateChange(()=>{setTimeout(updateSession,0)});updateSession()}else msg('Supabase 연결 정보를 설정하면 회원가입을 사용할 수 있습니다.');
</script></body></html>
